<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <meta name="x-apple-disable-message-reformatting">
  <title>冷凍年菜取貨提醒</title>
  <style>
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; font-size: inherit !important; font-family: inherit !important; font-weight: inherit !important; line-height: inherit !important; }
    body { font-family: "Microsoft JhengHei", "PingFang TC", "Heiti TC", sans-serif; color: #333; line-height: 1.5; }
  </style>
</head>
<!-- 由 gas/tools/build_email_templates.py 產生，要改樣式或文案請改產生器再重新產生 -->
<body style="margin: 0; padding: 10px; background-color: #f9f9f9;">
  <div style="max-width: 600px; margin: 0 auto; border: 1px solid #e0e0e0; padding: 25px; border-radius: 8px; background-color: #ffffff;">

    <div style="margin-bottom: 14px; font-size: 14px;">
      <span style="font-weight: bold; color: #000;"><?= data.name ?></span> 先生/小姐你好：<br><br>
      <div style="font-size: 13px; color: #444; line-height: 1.8;">
        您的年菜已準備完成，歡迎來店取貨<br>
        您預定的取貨日期：<span style="color: #2A52BE; font-weight: bold;"><?= data.shipDate ?></span><br>
        取貨請帶白色訂購單據或此畫面截圖<br>
        如需變更取貨日請提前告知我們備貨<br>
        <strong>咕咕義小餐館</strong>感謝您的訂購與支持！
      </div>
    </div>

    <h3 style="color: #333; font-size: 15px; margin-top: 30px; margin-bottom: 12px; letter-spacing: 1px; border-left: 8px solid #d32f2f; padding-left: 10px;">訂購明細</h3>
    <div style="border: 1px solid #f0f0f0; border-radius: 8px; padding: 5px; margin-bottom: 10px;">
      <div style="padding: 8px 5px 10px; font-size: 12px; color: #666; border-bottom: 1px solid #f0f0f0; margin-bottom: 4px;">
        <? if (data.isOnsite && data.seqLabel) { ?>
        訂購編號：<span style="color: #2A52BE; font-weight: bold;"><?= data.seqLabel ?></span>
        <? } else { ?>
        訂單時間：<span style="color: #2A52BE; font-weight: bold;"><?= data.orderTime ?></span>
        <? } ?>
      </div>
      <table style="width: 100%; border-collapse: collapse; border: none;">
        <thead>
          <tr style="background-color: #f8f8f8;">
            <th style="padding: 8px 5px; font-size: 12px; color: #666; font-weight: bold; letter-spacing: 1px; border: none; text-align: left; border-radius: 4px 0 0 4px;">品項名稱</th>
            <th style="padding: 8px 5px; font-size: 12px; color: #666; font-weight: bold; letter-spacing: 1px; border: none; width: 75px; text-align: center; border-radius: 0 4px 4px 0;">數量</th>
          </tr>
        </thead>
        <tbody>
          <? for (var i = 0; i < data.items.length; i++) { ?>
          <tr style="border-bottom: 1px solid #f6f6f6;">
            <td style="padding: 8px 5px; vertical-align: top; border: none;">
              <div style="font-size: 12px; color: #333; font-weight: bold; line-height: 1.2;"><?= data.items[i].name ?></div>
              <? if (data.items[i].sub) { ?>
                <div style="border-left: 1px solid #e5e5e5; margin-left: 1px; padding-left: 6px; margin-top: 4px;">
                  <? var subItems = data.items[i].sub.split('、'); for (var k = 0; k < subItems.length; k++) { ?>
                    <div style="font-size: 11px; color: #999; margin-bottom: 2px; line-height: 1.3; white-space: nowrap;"><?= subItems[k] ?></div>
                  <? } ?>
                </div>
              <? } ?>
            </td>
            <td style="padding: 8px 5px; vertical-align: top; border: none; text-align: center; font-size: 12px; color: #333; font-weight: bold;"><?= data.items[i].qty ?></td>
          </tr>
          <? } ?>
        </tbody>
        <tfoot>
          <tr>
            <td colspan="2" style="padding: 12px 18px 12px 12px; text-align: right; font-size: 12px; color: #999; border: none;">
              共計 <span style="color: #333; font-weight: bold; margin-left: 3px;"><?= data.totalCount ?></span> 件商品
            </td>
          </tr>
        </tfoot>
      </table>
    </div>

    <h3 style="color: #333; font-size: 15px; margin-top: 30px; margin-bottom: 12px; letter-spacing: 1px; border-left: 8px solid #2A52BE; padding-left: 10px;">取貨資訊</h3>
    <div style="background-color: #fcfcfc; border: 1px solid #f0f0f0; border-radius: 8px; padding: 5px 10px; margin-bottom: 10px;">
      <table style="width: 100%; border-collapse: collapse; border: none; margin: 0;">
        <tr style="border-bottom: 1px solid #f0f0f0;">
          <td style="border: none; padding: 8px 0; width: 80px; color: #888; font-size: 12px; vertical-align: top;">取貨日期</td>
          <td style="border: none; padding: 8px 0; color: #333; font-size: 12px; font-weight: bold; line-height: 1.5;"><?= data.shipDate ?></td>
        </tr>
        <tr style="border-bottom: 1px solid #f0f0f0;">
          <td style="border: none; padding: 8px 0; width: 80px; color: #888; font-size: 12px; vertical-align: top;">取貨時段</td>
          <td style="border: none; padding: 8px 0; color: #333; font-size: 12px; font-weight: bold; line-height: 1.5;"><?= data.pickupHours ?></td>
        </tr>
        <tr>
          <td style="border: none; padding: 8px 0; width: 80px; color: #888; font-size: 12px; vertical-align: top;">取貨地點</td>
          <td style="border: none; padding: 8px 0; color: #333; font-size: 12px; font-weight: bold; line-height: 1.5;"><a href="<?= data.mapUrl ?>" target="_blank" style="color: #333; text-decoration: underline;"><?= data.storeAddress ?></a></td>
        </tr>
      </table>
    </div>

    <div style="text-align: center; margin: 24px 0 4px;">
      <a href="<?= data.ackUrl ?>" target="_blank" style="background-color: #C1032F; border-radius: 28px; color: #ffffff; display: inline-block; font-size: 14px; font-weight: bold; letter-spacing: 1px; padding: 10px 30px; text-decoration: none;">我已收到取貨提醒</a>
      <div style="font-size: 11px; color: #999; margin-top: 8px;">按下按鈕讓我們知道您已收到這封信</div>
    </div>

    <div style="margin-top: 20px; text-align: center;">
      <div><a href="<?= data.mapUrl ?>" target="_blank"><img src="https://mcusercontent.com/c27db4d77ffc4c29cdbe402a9/images/945a049c-4a56-d37c-288c-e12771643211.png" width="200" height="auto" alt="咕咕義小餐館" style="display: inline-block; border: 0;"></a></div>
      <div style="display: inline-block; opacity: 0.6; margin-top: -5px;">
        <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="margin: 0 auto;"><tr><td style="padding: 0 8px;"><a href="https://www.facebook.com/bistrogoodgoodeat/" target="_blank"><img src="https://app-rsrc.getbee.io/public/resources/social-networks-icon-sets/t-only-logo-default-gray/facebook@2x.png" width="24" height="auto" alt="Facebook" title="Facebook" style="display: block; height: auto; border: 0;"></a></td><td style="padding: 0 8px;"><a href="https://www.instagram.com/goodgoodeatrestaurant/" target="_blank"><img src="https://app-rsrc.getbee.io/public/resources/social-networks-icon-sets/t-only-logo-default-gray/instagram@2x.png" width="24" height="auto" alt="Instagram" title="Instagram" style="display: block; height: auto; border: 0;"></a></td><td style="padding: 0 8px;"><a href="<?= data.line ?>" target="_blank"><img src="https://app-rsrc.getbee.io/public/resources/social-networks-icon-sets/t-only-logo-default-gray/line@2x.png" width="24" height="auto" alt="LINE" title="LINE" style="display: block; height: auto; border: 0;"></a></td></tr></table>
      </div>
      <div style="color: #b2b2b2; font-size: 10px; line-height: 1.5; text-align: center; margin-top: 5px; padding: 0 22px;">
        <p style="margin: 0;">聯絡電話：<?= data.storePhone ?></p>
        <p style="margin: 0;">地址：<a href="<?= data.mapUrl ?>" target="_blank" style="text-decoration: underline; color: #969696;"><?= data.storeAddress ?></a></p>
        <p style="margin: 0;">© Copyright <?= data.year ?>. 咕咕義小餐館. All Rights Reserved.</p>
      </div>
    </div>
  </div>
</body>
</html>
